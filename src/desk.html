<style>
:root{

}

  --cedar:#E59A8F; --ink:#EEF2F5; --taupe:#C2CCD5; --pampas:#4A5967; --line:#2A353F;

  --paper:#232E38; --muted:#8E9BA7; --offday:#182028; --satbg:#202A33; --hover:rgba(255,255,255,.05);
  --warn-fg:#F1DBAA; --good-fg:#CFE8DC; --side-bg:#1F2A34; color-scheme:dark } }
:root[data-theme="dark"]{
  --cream:#141B22; --card:#1C252E; --linen:#2B3742; --forest:#9FC1D6; --forest-dk:#BCD6E6;

  --good:#9FD0BA; --good-bg:#1F3A30; --warn:#E5BC6C; --warn-bg:#3B3120; --bad:#F09C8A; --bad-bg:#45251F;

*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--taupe);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cedar)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cedar);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.brand img{width:132px;height:auto}

.nav{display:flex;flex-direction:column;gap:2px}

.nav .count{margin-left:auto;background:var(--side-strong);color:var(--side-bg);font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px}

.side .foot{margin-top:auto;font-size:12px;color:rgba(216,199,171,.7);padding:0 8px}
.main{min-width:0}

.btn:hover{background:var(--forest-dk)}
.btn.ghost{background:transparent;color:var(--forest)}

.grid{display:grid;gap:16px}

.fit{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--pampas);border-radius:2px;background:var(--paper)}
select.f,input.f,textarea.f{padding:8px 10px;border:1px solid var(--pampas);border-radius:2px;background:var(--paper);min-height:40px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--pampas);background:transparent;padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer;color:var(--taupe);min-height:34px}
.tabs button.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.tabs button .c{opacity:.7;margin-left:4px}
table.list{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.empty{padding:28px;text-align:center;color:var(--muted)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(35,33,31,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;padding-right:env(safe-area-inset-right, 0px);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);width:min(560px,100%);background:var(--cream);z-index:41;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:none} .scrim.open{display:block}
.drawer .dh{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--card)}

.x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--taupe);width:44px;height:44px;margin-top:-8px;margin-right:-10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:4px 0 18px}
.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar);font-weight:600}
.facts dd{margin:2px 0 0;color:var(--ink)}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.stages button{border:1px solid var(--pampas);background:var(--paper);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.stages button.on{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.section{margin-top:22px}
.section > .eyebrow{display:block;margin-bottom:8px}
.reasons{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px}
.reasons li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.reasons li span:last-child{font-weight:600;color:var(--ink)}
.quote{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink);white-space:pre-wrap;font-size:14px}
.note{border-left:2px solid var(--pampas);padding:4px 0 4px 12px;margin:8px 0;font-size:14px}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:10px 0}
.goodbox{background:var(--good-bg);color:var(--good-fg);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:10px 0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card)}
.cal .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cedar);font-weight:600;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card)}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.cal .d.off{background:var(--offday);color:var(--muted)}
.cal .d.sat{background:var(--satbg)}
.cal .d .num{font-weight:600;color:var(--ink);font-size:12.5px}
.cal .ev{display:block;width:100%;text-align:left;border:0;border-radius:3px;padding:3px 6px;font-size:11.5px;line-height:1.3;cursor:pointer;background:var(--forest);color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.hold{background:var(--paper);color:var(--ink);border:1px solid var(--forest)}
.cal .ev.inq{background:var(--linen);color:var(--ink)}
.cal .ev.clash{box-shadow:inset 3px 0 0 var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.sats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--paper);color:var(--taupe);font-size:13px;cursor:pointer;text-align:left}
.sat.booked{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.sat b{display:block;font-size:14px;color:inherit}
.sat.booked b{color:var(--cream)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink);font-weight:500}
.form label.full{grid-column:1/-1}
.form .checks label{flex-direction:row;font-weight:400}
body.lock{overflow:hidden}
.form .hint{font-weight:400;color:var(--muted);font-size:12px}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);cursor:pointer}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--forest);flex:none}
.checks .due{margin-left:auto;font-size:12px;white-space:nowrap}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.lines tr.total td{font-weight:600;border-bottom:0;padding-top:12px;font-size:16px}
.lines .sub{display:block;font-size:12px;color:var(--muted)}
/* charts */
.chart{position:relative;padding-top:8px}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--pampas)}
.bars .b{flex:1;min-width:0;background:var(--forest);border-radius:4px 4px 0 0;position:relative;cursor:default;outline:none}
.bars .b:hover,.bars .b:focus{background:var(--cedar)}
.bars .b.lite{background:var(--pampas)}
.xl{display:flex;gap:2px;margin-top:6px;font-size:11px;color:var(--muted)}
.xl span{flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--cream);font-size:12.5px;padding:6px 9px;border-radius:3px;z-index:60;display:none;white-space:nowrap}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.mobile-nav{display:none}
@media (prefers-reduced-motion: reduce){ .drawer{transition:none} }
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tools a{display:block;text-decoration:none;color:inherit}
.tools a .card{height:100%}
.tools a:hover .card{border-color:var(--pampas);background:var(--paper)}
.sheet{background:var(--paper);border:1px solid var(--line);padding:26px;border-radius:var(--r)}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--pampas);padding-bottom:12px;margin-bottom:12px}
@media (max-width: 980px){
  .tiles,.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width: 760px){
  .app{display:block}
  .side{display:none}
  .page{padding-block:20px 110px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .mock{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));font-size:12px}
  h1{font-size:28px}
  .form{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .tiles{gap:10px}
  .tile{padding:12px 14px}.tile .n{font-size:30px}
  .hide-m{display:none !important}
  .cal .d{min-height:62px;padding:3px}
  .cal .ev{font-size:0;height:7px;padding:0}
  .cal .dow{padding:6px 2px;font-size:10px;text-align:center}
  .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--side-bg);z-index:30;padding:6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}
  .mobile-nav a{color:var(--side-fg);text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:48px;justify-content:center}
  .mobile-nav a.on{color:var(--side-strong);font-weight:600}

  .drawer .dh,.drawer .db{padding-left:16px;padding-right:16px}
}
@media (min-width: 761px){ .show-m{display:none !important} }
@media print{
  .side,.mock,.mobile-nav,.no-print,.head .btn{display:none !important}
  .app{display:block} .page{padding:0} body{background:#fff}
  .sheet{border:0;padding:0}
}
</style>

<script>
"use strict";
const DATA = /*__DATA__*/null;
const TODAY = new Date(DATA.today + "T12:00:00");
const DAY = 86400000;
const STORE_KEY = "inquiry-desk-demo-v1";

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const d0 = iso => iso ? new Date(iso.slice(0, 10) + "T12:00:00") : null;

const fmtDate = (iso, prec) => { const d = d0(iso); if (!d) return "No date yet"; if (prec === "month") return MONTH[d.getMonth()] + " " + d.getFullYear(); return WD[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };

const bartendersFor = g => Math.max(2, Math.ceil((g || 0) / 75));
const plural = (n, w, p) => n + " " + (n === 1 ? w : (p || w + "s"));

/* ---------- saved state ---------- */
const DEFAULT_SETTINGS = {

/* ---------- inquiries with demo stages ---------- */
const STAGES = ["New", "Replied", "Call set", "Quote sent", "Booked", "Done", "Not a fit", "Lost"];
const ACTIVE = ["New", "Replied", "Call set", "Quote sent"];
const LOST_REASONS = ["Date taken", "Went with someone else", "Budget", "No reply", "Not a fit for us"];

function demoStage(q) {
  const h = hash(q.id + "s");
  const ev = d0(q.eventDate);
  const age = daysBetween(new Date(q.created), TODAY);
  const future = ev && ev > TODAY;
  if (!future && (ev || age > 120)) return { stage: "Earlier", at: q.created };
  if (age <= 12) return { stage: "New", at: q.created };
  const r = h % 20;
  // demo: the last step happened 1 to 18 days ago, never before they wrote
  const at = new Date(Math.max(new Date(q.created).getTime() + DAY, TODAY.getTime() - ((h >>> 5) % 18 + 1) * DAY)).toISOString();
  if (!ev) return { stage: r < 10 ? "Replied" : "Lost", at, reason: "No reply" };
  if (r < 7) return { stage: "Booked", at };
  if (r < 10) return { stage: "Quote sent", at };
  if (r < 12) return { stage: "Call set", at };
  if (r < 15) return { stage: "Replied", at };
  if (r < 18) return { stage: "Lost", at, reason: LOST_REASONS[h % LOST_REASONS.length] };
  return { stage: "Replied", at };
}

let INQ = [];
function buildInquiries() {
  INQ = DATA.inquiries.concat(S.added).map(q0 => {
    const q = Object.assign({}, q0, S.edits[q0.id] || {});
    const st = S.stage[q.id] || demoStage(q);
    q.stage = st.stage; q.stageAt = st.at; q.lostReason = st.reason;
    q.fit = fitScore(q);
    q.bartenders = bartendersFor(q.guests);
    const ev = d0(q.eventDate);
    q.peakSat = !!(ev && q.datePrecision !== "month" && ev.getDay() === 6 && ev.getMonth() >= 4 && ev.getMonth() <= 9);
    q.setup = (S.events[q.id] && S.events[q.id].setup) || (q.flags.includes("trailer") || hash(q.id + "t") % 3 === 0 ? "Mobile Bar Trailer" : hash(q.id + "u") % 4 === 0 ? "Bartending Only" : "Portable Bar");
    return q;
  });
  // date clashes: an open inquiry on a date that's already booked
  const booked = new Map();
  INQ.filter(q => q.stage === "Booked" && q.eventDate && q.datePrecision !== "month").forEach(q => { const k = q.eventDate; booked.set(k, (booked.get(k) || []).concat(q)); });
  INQ.forEach(q => {
    const list = q.eventDate && q.datePrecision !== "month" ? (booked.get(q.eventDate) || []) : [];
    q.dateTaken = q.stage !== "Booked" && list.length > 0;
    q.doubleBooked = q.stage === "Booked" && list.length > 1;
  });
}

/* ---------- fit score ---------- */
function fitParts(q) {
  const p = [];
  const t = q.type;
  if (t === "Wedding") p.push(["Wedding", 35]);
  else if (["Engagement", "Rehearsal", "Shower"].includes(t)) p.push([t + " (wedding related)", 12]);
  else if (t === "Not said") p.push(["Type of event not said", 5]);
  else p.push([t, 0]);
  const g = q.guests;
  if (g == null) p.push(["Guest count not given", 0]);
  else if (g >= 150) p.push([g + " guests", 20]);
  else if (g >= 100) p.push([g + " guests", 15]);
  else if (g >= 60) p.push([g + " guests", 8]);
  else if (g < 40) p.push(["Only " + g + " guests", -10]);
  else p.push([g + " guests", 0]);
  const ev = d0(q.eventDate);
  if (ev) {
    const lead = daysBetween(new Date(q.created), ev);
    const m = Math.round(lead / 30);
    if (lead >= 180) p.push(["Wrote " + m + " months ahead", 15]);
    else if (lead >= 60) p.push(["Wrote " + m + " months ahead", 8]);
    else if (lead < 30) p.push(["Less than a month's notice", -15]);
    else p.push(["About " + m + " months' notice", 0]);
  } else p.push(["No date yet", 0]);
  if (q.knownVenue) p.push(["A venue you've poured at", 10]);
  if (q.flags.includes("referral")) p.push(["Referred by someone", 10]);
  if (q.flags.includes("trailer") || q.flags.includes("signature")) p.push(["Asked for the trailer or signature drinks", 5]);
  return p;
}
function fitScore(q) { return Math.max(0, Math.min(100, 20 + fitParts(q).reduce((a, x) => a + x[1], 0))); }
const fitLabel = n => n >= 70 ? "Strong" : n >= 50 ? "Good" : n >= 30 ? "Maybe" : "Low";
const fitHTML = n => `<span class="fit" title="Fit ${n} of 100"><i><b style="width:${n}%"></b></i>${fitLabel(n)}</span>`;

function stageChip(q) {
  const cls = { New: "warn", Replied: "out", "Call set": "out", "Quote sent": "out", Booked: "green", Done: "good", "Not a fit": "", Lost: "", Earlier: "" }[q.stage] || "";
  return `<span class="chip ${cls}">${esc(q.stage === "Earlier" ? "Before the Desk" : q.stage)}</span>`;
}
const followUpDue = q => (q.stage === "Replied" || q.stage === "Quote sent") && daysBetween(new Date(q.stageAt), TODAY) >= 5;

}

  $("#page").innerHTML = `

  <div class="warnbox">These use common rule-of-thumb amounts. Your own amounts go in <a href="#prices">Settings</a>.</div>
  <div class="two">
    <section class="card"><div class="form">
      <label>Guests<input class="f" type="number" id="g" min="1" value="${q && q.guests || 120}"></label>
      <label>Hours of service<input class="f" type="number" id="h" min="1" max="10" value="4"></label>
      <label>Beer %<input class="f" type="number" id="beer" min="0" max="100" value="${R.beerPct}"></label>
      <label>Wine %<input class="f" type="number" id="wine" min="0" max="100" value="${R.winePct}"></label>
      <label>Cocktails %<input class="f" type="number" id="ck" min="0" max="100" value="${R.cocktailPct}"><span class="hint">Set to 0 for a beer and wine bar.</span></label>
      <label>Signature cocktails<input class="f" type="number" id="sig" min="0" max="4" value="${q && q.flags.includes("signature") ? 2 : 2}"><span class="hint">0 means a classic full bar.</span></label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="toast" checked style="width:18px;height:18px;accent-color:var(--forest)"> Champagne toast</label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="summer" ${q && q.eventDate && [5, 6, 7].includes(d0(q.eventDate).getMonth()) ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--forest)"> Summer heat (more ice)</label>
    </div></section>
    <section class="sheet" id="sout"></section>
  </div>`;
  const calc = () => {
    const g = Math.max(1, +$("#g").value || 1), h = Math.max(1, +$("#h").value || 4);
    let b = +$("#beer").value || 0, w = +$("#wine").value || 0, c = +$("#ck").value || 0; const tot = b + w + c || 1; b /= tot; w /= tot; c /= tot;
    const buf = 1 + R.bufferPct / 100;
    const drinks = g * R.drinkersPct / 100 * (R.firstHour + (h - 1) * R.perHour);
    const wineB = Math.ceil(drinks * w / R.pours * buf), white = Math.round(wineB * R.whitePct / 100);
    const beerCases = Math.ceil(drinks * b / 24 * buf);
    const sigN = +$("#sig").value || 0;
    const spirit = Math.ceil(drinks * c / R.cocktailsPerBottle * buf);
    const toast = $("#toast").checked ? Math.ceil(g / R.toastGlasses) : 0;
    const ice = Math.ceil(g * (R.icePerGuest + ($("#summer").checked ? .5 : 0)));
    const rows = [];
    if (beerCases) rows.push(["Beer", `${beerCases} cases of 24`, "Mix of a light beer, an IPA and a seltzer"]);
    if (wineB) rows.push(["Wine", `${wineB} bottles`, `${white} white or rosé, ${wineB - white} red`]);
    if (spirit) rows.push(["Spirits", `${spirit} bottles (750 ml)`, sigN ? `Split across ${sigN} signature ${sigN === 1 ? "cocktail" : "cocktails"}, about ${Math.ceil(spirit / sigN)} each` : "Vodka, gin, tequila, rum and bourbon"]);
    if (spirit) rows.push(["Mixers", `${Math.ceil(drinks * c / 5)} liters`, "Club soda, tonic, ginger beer and juices"]);
    if (toast) rows.push(["Champagne or prosecco", `${toast} bottles`, "For the toast"]);
    rows.push(["Sparkling water and soda", `${Math.ceil(g / 4)} liters`, "For non-drinkers and the water station"]);
    rows.push(["Ice", `${ice} lb (${Math.ceil(ice / 20)} bags of 20 lb)`, "Delivered the day of"]);
    $("#sout").innerHTML = `<div class="sh"><div><span class="eyebrow">Shopping list</span><h2>${esc(q ? q.name : "Your wedding")}</h2><div class="small muted">${q && q.eventDate ? esc(fmtDate(q.eventDate, q.datePrecision)) + " · " : ""}${g} guests · ${h} hours</div></div><div class="small muted">Hollow Creek Mobile Bar</div></div>
      <table class="lines">${rows.map(r => `<tr><td>${esc(r[0])}<span class="sub">${esc(r[2])}</span></td><td>${esc(r[1])}</td></tr>`).join("")}</table>
      <p class="small" style="margin-top:12px">Based on about ${Math.round(drinks)} drinks, plus ${R.bufferPct}% extra so you don't run short. We bring garnishes, house-made syrups, cups, napkins and straws.</p>
      <div class="no-print" style="display:flex;gap:8px;margin-top:12px"><button class="btn sm ghost" id="scopy">Copy list</button><span class="small muted" id="sc" style="align-self:center"></span></div>`;
    $("#scopy").onclick = async () => { try { await navigator.clipboard.writeText(rows.map(r => `${r[0]}: ${r[1]} (${r[2]})`).join("\n")); $("#sc").textContent = "Copied"; } catch (e) { $("#sc").textContent = "Copy didn't work here"; } };
  };
  $("#page").querySelectorAll("input").forEach(el => el.addEventListener("input", calc));
  calc();
}

/* ---------- Insights ---------- */
function barChart(values, labels, fmt, lite) {
  const max = Math.max(1, ...values);

    <div class="xl">${labels.map(l => `<span>${esc(l)}</span>`).join("")}</div></div>`;
}
function viewInsights() {
  const all = DATA.inquiries;

  const med = leads[Math.floor(leads.length / 2)];

  const gb = [["Under 50", g => g < 50], ["50 to 99", g => g >= 50 && g < 100], ["100 to 149", g => g >= 100 && g < 150], ["150 to 199", g => g >= 150 && g < 200], ["200+", g => g >= 200]];
  const types = ["Wedding", "Not said", "Party", "Birthday", "Corporate", "Graduation", "Shower", "Engagement", "Rehearsal"];

  $("#page").innerHTML = `
  <div class="head"><div class="grow"><span class="eyebrow">Sample data · 2023 to 2026</span><h1>Insights</h1><p>All numbers here come from randomly generated sample data.</p></div></div>
  <div class="statrow">
    <div class="tile"><span class="eyebrow">Inquiries</span><div class="n">${all.length}</div><div class="l">(sample data)</div></div>
    <div class="tile"><span class="eyebrow">Ask about price</span><div class="n">${Math.round(price / all.length * 100)}%</div><div class="l">of all messages</div></div>
    <div class="tile"><span class="eyebrow">Sep and Oct</span><div class="n">${Math.round(sepOct / dated.length * 100)}%</div><div class="l">of the event dates asked about</div></div>
    <div class="tile"><span class="eyebrow">Notice</span><div class="n">${(med / 30.4).toFixed(1)}</div><div class="l">months ahead, typically</div></div>
  </div>
  <div class="two" style="grid-template-columns:1fr 1fr">
    <section class="card"><span class="eyebrow">Inquiries per year</span><h3>${perYear[perYear.length - 1]} so far in ${years[years.length - 1]}</h3>${barChart(perYear, years, (v, i) => `${years[i]}: ${v} inquiries${i === 0 ? " (from May)" : i === years.length - 1 ? " (to date)" : ""}`)}</section>
    <section class="card"><span class="eyebrow">When the event is</span><h3>Most event dates fall in September and October (sample)</h3>${barChart(evMonth, MON.map(m => m[0]), (v, i) => `${MONTH[i]}: ${v} event dates`, i => i !== 8 && i !== 9)}</section>
    <section class="card"><span class="eyebrow">When people write</span><h3>Inquiries mostly arrive in the first half of the year</h3>${barChart(recvMonth, MON.map(m => m[0]), (v, i) => `${MONTH[i]}: ${v} inquiries, all years`)}<p class="small muted">So winter and spring replies decide the fall calendar.</p></section>
    <section class="card"><span class="eyebrow">Guest count</span><h3>Typically about ${gs.sort((a, b) => a - b)[Math.floor(gs.length / 2)]} guests, which means 2 bartenders</h3>${barChart(gb.map(([, f]) => gs.filter(f).length), gb.map(x => x[0]), (v, i) => `${gb[i][0]} guests: ${v} inquiries`)}</section>
  </div>
  <div class="two" style="grid-template-columns:1fr 1fr;margin-top:20px">
    <section class="card"><span class="eyebrow">What they're planning</span><table class="lines" style="margin-top:8px">${types.map(t => `<tr><td>${t === "Not said" ? "Didn't say" : t}</td><td>${all.filter(q => q.type === t).length}</td></tr>`).join("")}</table></section>
    <section class="card"><span class="eyebrow">Other things worth knowing</span><table class="lines" style="margin-top:8px">
      <tr><td>Sent from a phone</td><td>${Math.round(mob / dev.length * 100)}%</td></tr>
      <tr><td>Wrote more than once</td><td>${new Set(all.filter(q => q.timesWritten > 1).map(q => q.person)).size} people</td></tr>
      <tr><td>Wrote less than a month ahead</td><td>${leads.filter(n => n < 30).length}</td></tr>

  </div>`;
}

function addInquiry() {
  const dr = $("#drawer");
  dr.innerHTML = `<div class="dh"><div><span class="eyebrow">From Instagram, a call or an email</span><h2>Add an inquiry</h2></div><button class="x" data-close aria-label="Close">×</button></div>
  <div class="db"><form class="form" id="addf">
    <label class="full">Name<input class="f" name="name" required></label>
    <label>Event date<input class="f" type="date" name="date"></label>
    <label>Guests<input class="f" type="number" name="guests" min="1"></label>
    <label>Type<select class="f" name="type">${["Wedding", "Engagement", "Rehearsal", "Shower", "Birthday", "Corporate", "Party", "Not said"].map(t => `<option>${t}</option>`).join("")}</select></label>
    <label>Came from<select class="f" name="channel">${["Instagram", "Phone call", "Email", "The Knot", "Planner", "Venue", "Friend"].map(t => `<option>${t}</option>`).join("")}</select></label>
    <label class="full">Venue or town<input class="f" name="location"></label>
    <label class="full">What they asked<textarea class="f" name="message"></textarea></label>
    <div class="full"><button class="btn" type="submit">Add it</button></div>
  </form><p class="small muted">In the real Desk, website form messages show up here on their own.</p></div>`;
  $("#addf").onsubmit = e => {
    e.preventDefault(); const f = new FormData(e.target);
    const loc = String(f.get("location") || "").trim(); const venue = ["Alder Hollow Barn", "Fernbrook Estate", "Larkspur Hall", "Stonebridge Farm", "Marlow Pond Lodge", "Wren Meadow", "Copper Kettle Mill", "Birchwood Pavilion"].find(v => loc.toLowerCase().includes(v.toLowerCase().slice(0, 10)));
    const msg = String(f.get("message") || "");
    const q = { id: 1e12 + Date.now(), person: "added" + Date.now(), name: String(f.get("name")).trim(), created: new Date().toISOString().slice(0, 16), channel: String(f.get("channel")), device: "", guests: +f.get("guests") || null, guestsText: String(f.get("guests") || ""), location: venue || loc, knownVenue: !!venue, eventDate: f.get("date") || null, datePrecision: f.get("date") ? "day" : null, eventDateText: "", type: String(f.get("type")), flags: [/referr|recommend/i.test(msg) || ["Planner", "Venue", "Friend"].includes(String(f.get("channel"))) ? "referral" : null, /trailer/i.test(msg) ? "trailer" : null, /signature/i.test(msg) ? "signature" : null, /price|cost|quote/i.test(msg) ? "price" : null].filter(Boolean), message: msg || "Added by hand.", timesWritten: 1 };
    S.added.push(q); S.stage[q.id] = { stage: "New", at: new Date().toISOString() }; save(); closeDrawer(); refresh(q.id);
  };
  dr.classList.add("open"); $("#scrim").classList.add("open"); document.body.classList.add("lock");
}

/* ---------- global clicks, tooltips, reset ---------- */
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { openDrawer(o.dataset.open); return; }
  const ev = e.target.closest("[data-event]"); if (ev) { closeDrawer(); location.hash = "event-" + ev.dataset.event; return; }
  if (e.target.closest("[data-close]")) { closeDrawer(); return; }
  if (e.target.closest("[data-add]")) { addInquiry(); return; }
});
document.addEventListener("click", e => { const a = e.target.closest("#drawer a[href^='#']"); if (a) closeDrawer(); });
const tip = $("#tip");
const showTip = el => { const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.style.display = "block"; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)) + "px"; tip.style.top = Math.max(8, r.top - 34) + "px"; };
document.addEventListener("mouseover", e => { const b = e.target.closest("[data-tip]"); if (b) showTip(b); else tip.style.display = "none"; });
document.addEventListener("focusin", e => { const b = e.target.closest("[data-tip]"); if (b) showTip(b); else tip.style.display = "none"; });
let resetArmed = null;
$("#reset").onclick = () => {
  const b = $("#reset");
  if (!resetArmed) { b.textContent = "Tap again to reset stages, notes and edited replies"; resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "Reset the demo"; }, 5000); return; }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = "Reset the demo";
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  S = load(); CAL = null; route();
};
route();
